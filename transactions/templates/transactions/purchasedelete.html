{% extends "store/base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-danger">
                <div class="card-body text-center">
                    <h2 class="text-danger mb-4">
                        <i class="fas fa-exclamation-triangle"></i> Delete Purchase
                    </h2>
                    <p class="lead">Are you sure you want to permanently delete this purchase?</p>
                    <div class="mb-4">
                        <p class="h5">ID:{{ object.id }}</p>
                        <p class="text-muted">Purchase Record</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="fas fa-trash"></i> Confirm Delete
                            </button>
                            <a href="{% url 'purchaseslist' %}" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
