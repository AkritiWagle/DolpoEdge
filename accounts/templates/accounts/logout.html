{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
        crossorigin="anonymous">
    <title>IMS: Logout</title>
    <style>
        .logout-page {
            width: 660px;
            padding: 8% 0 0;
            margin: auto;
        }
        .text_edge {
            color: #f25b00;
        }
        .form {
            position: relative;
            z-index: 1;
            background: #212529;
            max-width: 660px;
            margin: 0 auto 100px;
            padding: 45px;
            text-align: center;
            box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
        }
        .form .message {
            margin: 15px 0 0;
            color: #b3b3b3;
            font-size: 12px;
        }
        .form .message a {
            color: #4CAF50;
            text-decoration: none;
        }
        .form button {
            text-transform: uppercase;
            outline: 0;
            background: #4CAF50;
            width: 100%;
            border: 0;
            padding: 15px;
            color: #FFFFFF;
            font-size: 14px;
            -webkit-transition: all 0.3 ease;
            transition: all 0.3 ease;
            cursor: pointer;
        }
        .form button:hover,.form button:active,.form button:focus {
            background: #43A047;
            }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .logo-container {
  display: flex;
  align-items: center; /* Vertically center */
  justify-content: center; /* Horizontally center */
  gap: 10px; /* Space between logo and text */
}

.logo-img {
  height: 40px; /* Adjust size as needed */
  width: auto;
}
    </style>
</head>
<body>
    <div class="logout-page">
        <div class="form">
            <!-- <div>
                <strong class="navbar-brand" style="font-size: 26px; color: #FFFFFF;">Dolpo<span class="text_edge">Edge</span></strong>
            </div> -->

            <div class="logo-container">
                <img src="{% static 'images/logo/dolpo_logo_small.png' %}" alt="Dolpo Logo" class="logo-img">
                <strong class="navbar-brand" style="font-size: 26px; color: #FFFFFF;" >
                  Dolpo<span class="text_edge">Edge</span>
                </strong>
              </div>
              
        
              <br>
              <div>
                <strong class="" style="font-size: 20px; color: #ffffff;">A <span style="font-size: 20px; color: #f25b00;">fun</span> that <span style="font-size: 20px; color: #f25b00;">never ends</span></strong>
              </div>
              
            <div class="alert alert-info my-3" style="background: #FFFFFF;" role="alert">
                <h4 >You have logged out successfully!</h4>
                <!-- <p>See you soon!</p> -->
            </div>
            <a  href="{% url 'user-login' %}">
                <button  type="submit" name="button">login</button>
            </a>
        </div>
    </div>
</body>
</html>
