{% extends "store/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h4><i class="fas fa-exclamation-triangle"></i> Delete Recipe Confirmation</h4>
        </div>
        <div class="card-body">
            <p class="lead">Are you sure you want to delete the base recipe:</p>
            <h3 class="text-center mb-4">"{{ recipe.name }}"</h3>
            
            <div class="alert alert-warning">
                <strong>Warning:</strong> This action cannot be undone. All associated ingredients will be permanently deleted.
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="fas fa-trash-alt"></i> Confirm Delete
                    </button>
                    <a href="{% url 'recipe_list' %}" class="btn btn-secondary btn-lg">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
